name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and debug build
        run: gradle --no-daemon :hap-core:test :media-rtp:test :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Publish unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            hap-core/build/reports/tests/
            media-rtp/build/reports/tests/
          if-no-files-found: ignore
      - name: Publish debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: campodroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
